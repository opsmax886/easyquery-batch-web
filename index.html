<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyQuery 批量焓值计算</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f4;
      --panel: #ffffff;
      --ink: #20231f;
      --muted: #6a7169;
      --line: #d8ddd4;
      --brand: #116b5f;
      --brand-2: #0f4f97;
      --warn: #a75219;
      --bad: #a93131;
      --good: #1d7350;
      --soft: #eef4f1;
      --shadow: 0 18px 45px rgba(29, 44, 40, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.45;
    }

    header {
      padding: 28px 24px 18px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfa;
    }

    .header-inner,
    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 3vw, 40px);
      font-weight: 760;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    main {
      padding: 20px 0 34px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(330px, 0.9fr) minmax(430px, 1.1fr);
      gap: 18px;
      align-items: start;
    }

    section,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 16px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .small {
      color: var(--muted);
      font-size: 13px;
    }

    textarea {
      width: 100%;
      min-height: 370px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px 14px;
      color: var(--ink);
      background: #fcfdfb;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", monospace;
      font-size: 14px;
      line-height: 1.55;
      outline: none;
    }

    textarea:focus,
    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(17, 107, 95, 0.14);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    button,
    .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #fff;
      background: var(--brand);
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      user-select: none;
    }

    button.secondary,
    .file-button {
      color: var(--ink);
      border-color: var(--line);
      background: #f6f8f4;
    }

    button.blue {
      background: var(--brand-2);
    }

    button.warn {
      background: var(--warn);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    input[type="file"] {
      display: none;
    }

    .status {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      min-height: 72px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fcfdfb;
    }

    .stat b {
      display: block;
      margin-top: 4px;
      font-size: 22px;
      letter-spacing: 0;
    }

    progress {
      width: 100%;
      height: 12px;
      overflow: hidden;
      border: 0;
      border-radius: 999px;
      background: #e8ece5;
    }

    progress::-webkit-progress-bar {
      background: #e8ece5;
      border-radius: 999px;
    }

    progress::-webkit-progress-value {
      background: var(--brand);
      border-radius: 999px;
    }

    .table-wrap {
      margin-top: 12px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      max-height: 510px;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 880px;
      font-size: 14px;
    }

    th,
    td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: #37433b;
      background: #eef4f1;
      font-weight: 720;
    }

    th:first-child,
    td:first-child,
    th:nth-child(8),
    td:nth-child(8),
    th:nth-child(10),
    td:nth-child(10) {
      text-align: left;
    }

    tbody tr:hover {
      background: #f7faf8;
    }

    .ok {
      color: var(--good);
      font-weight: 650;
    }

    .error {
      color: var(--bad);
      font-weight: 650;
    }

    .output {
      width: 100%;
      min-height: 132px;
      margin-top: 12px;
      font-size: 13px;
    }

    .notice {
      margin-top: 12px;
      padding: 10px 12px;
      border-left: 4px solid var(--brand-2);
      border-radius: 6px;
      color: #36443c;
      background: var(--soft);
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .status {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      textarea {
        min-height: 260px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>EasyQuery 批量焓值计算</h1>
      <p class="subtitle">粘贴 Excel 中的 T、P、M 三列，批量输出 H、S、V、G、GJ。</p>
    </div>
  </header>

  <main>
    <div class="grid">
      <section class="panel">
        <div class="section-title">
          <h2>导入数据</h2>
          <span class="small">支持逗号、Tab、空格分隔</span>
        </div>
        <textarea id="input" spellcheck="false" placeholder="T,P,M
148.42,7.65,1000
146.43,7.22,1000
147.94,6.99,1000"></textarea>
        <div class="toolbar">
          <button id="run" class="blue" type="button">开始计算</button>
          <button id="stop" class="warn" type="button" disabled>停止</button>
          <button id="sample" class="secondary" type="button">填入示例</button>
          <button id="clear" class="secondary" type="button">清空</button>
          <label class="file-button" for="file">导入 CSV/TXT</label>
          <input id="file" type="file" accept=".csv,.txt,.tsv,text/csv,text/plain">
        </div>
        <div class="notice">
          从 Excel 复制三列后可直接粘贴；表头可写 T/P/M，也可写 温度/压力/质量。
        </div>
      </section>

      <section class="panel">
        <div class="section-title">
          <h2>计算结果</h2>
          <span id="message" class="small">等待导入</span>
        </div>

        <div class="status">
          <div class="stat"><span class="small">总行数</span><b id="total">0</b></div>
          <div class="stat"><span class="small">已完成</span><b id="done">0</b></div>
          <div class="stat"><span class="small">成功</span><b id="success">0</b></div>
          <div class="stat"><span class="small">错误</span><b id="failed">0</b></div>
        </div>

        <progress id="progress" value="0" max="100"></progress>

        <div class="toolbar">
          <button id="copy" type="button" disabled>复制结果</button>
          <button id="download" class="secondary" type="button" disabled>下载 CSV</button>
          <button id="copyH" class="secondary" type="button" disabled>只复制焓值 H</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>序号</th>
                <th>T</th>
                <th>P</th>
                <th>M</th>
                <th>H</th>
                <th>S</th>
                <th>V</th>
                <th>G</th>
                <th>GJ</th>
                <th>Err</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="10" style="text-align:left;color:#6a7169;">暂无结果</td></tr>
            </tbody>
          </table>
        </div>

        <textarea id="output" class="output" readonly placeholder="这里会生成可复制回 Excel 的制表符结果"></textarea>
      </section>
    </div>
  </main>

  <script>
    const API_URL = "/api/easyquery";
    const DELAY_MS = 260;

    const els = {
      input: document.getElementById("input"),
      output: document.getElementById("output"),
      tbody: document.getElementById("tbody"),
      run: document.getElementById("run"),
      stop: document.getElementById("stop"),
      sample: document.getElementById("sample"),
      clear: document.getElementById("clear"),
      file: document.getElementById("file"),
      copy: document.getElementById("copy"),
      copyH: document.getElementById("copyH"),
      download: document.getElementById("download"),
      message: document.getElementById("message"),
      total: document.getElementById("total"),
      done: document.getElementById("done"),
      success: document.getElementById("success"),
      failed: document.getElementById("failed"),
      progress: document.getElementById("progress"),
    };

    let shouldStop = false;
    let latestRows = [];

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function normalizeHeader(value) {
      return String(value || "").trim().replace(/\s+/g, "").toLowerCase();
    }

    function splitLine(line) {
      const trimmed = line.trim();
      if (!trimmed) return [];
      if (trimmed.includes("\t")) return trimmed.split("\t").map((v) => v.trim());
      if (trimmed.includes(",")) return trimmed.split(",").map((v) => v.trim());
      return trimmed.split(/\s+/).map((v) => v.trim());
    }

    function toNumber(value) {
      const text = String(value ?? "").trim();
      if (!text) return NaN;
      return Number(text.replace(/[，,]$/, ""));
    }

    function parseInput(text) {
      const lines = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      if (!lines.length) return [];

      const first = splitLine(lines[0]);
      const headerMap = first.map(normalizeHeader);
      const hasHeader = headerMap.some((h) => ["t", "温度", "temperature"].includes(h)) &&
        headerMap.some((h) => ["p", "压力", "pressure"].includes(h));

      let tIndex = 0;
      let pIndex = 1;
      let mIndex = 2;
      let dataLines = lines;

      if (hasHeader) {
        tIndex = headerMap.findIndex((h) => ["t", "温度", "temperature"].includes(h));
        pIndex = headerMap.findIndex((h) => ["p", "压力", "pressure"].includes(h));
        mIndex = headerMap.findIndex((h) => ["m", "质量", "mass"].includes(h));
        if (mIndex < 0) mIndex = 2;
        dataLines = lines.slice(1);
      }

      return dataLines.map((line, idx) => {
        const parts = splitLine(line);
        return {
          index: idx + 1,
          T: toNumber(parts[tIndex]),
          P: toNumber(parts[pIndex]),
          M: toNumber(parts[mIndex]),
          Err: "",
        };
      }).filter((row) => {
        const valid = Number.isFinite(row.T) && Number.isFinite(row.P) && Number.isFinite(row.M);
        if (!valid) row.Err = "T/P/M 有空值或非数字";
        return partsEnough(row) || valid;
      });
    }

    function partsEnough(row) {
      return Number.isFinite(row.T) || Number.isFinite(row.P) || Number.isFinite(row.M);
    }

    function cacheKey(row) {
      return [row.P, row.T, row.M].map((v) => Number(v).toPrecision(12)).join("|");
    }

    async function queryEasyQuery(row) {
      if (!Number.isFinite(row.T) || !Number.isFinite(row.P) || !Number.isFinite(row.M)) {
        return { ...row, H: "", S: "", V: "", G: "", GJ: "", Err: row.Err || "T/P/M 有空值或非数字" };
      }

      const body = new URLSearchParams({
        P: String(row.P),
        T: String(row.T),
        M: String(row.M),
      });

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body,
        });
        const text = await response.text();
        const data = JSON.parse(text);
        return {
          ...row,
          H: data.H || "",
          S: data.S || "",
          V: data.V || "",
          G: data.G || "",
          GJ: data.GJ || "",
          Err: data.Err || "",
        };
      } catch (error) {
        return { ...row, H: "", S: "", V: "", G: "", GJ: "", Err: error.message };
      }
    }

    function setBusy(isBusy) {
      els.run.disabled = isBusy;
      els.stop.disabled = !isBusy;
      els.sample.disabled = isBusy;
      els.clear.disabled = isBusy;
      els.file.disabled = isBusy;
    }

    function updateStats(rows, total) {
      const done = rows.length;
      const success = rows.filter((r) => !r.Err && r.H !== "").length;
      const failed = rows.filter((r) => r.Err).length;
      els.total.textContent = String(total);
      els.done.textContent = String(done);
      els.success.textContent = String(success);
      els.failed.textContent = String(failed);
      els.progress.max = total || 100;
      els.progress.value = done;
    }

    function htmlEscape(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function renderTable(rows) {
      if (!rows.length) {
        els.tbody.innerHTML = '<tr><td colspan="10" style="text-align:left;color:#6a7169;">暂无结果</td></tr>';
        return;
      }
      els.tbody.innerHTML = rows.map((row) => {
        const statusClass = row.Err ? "error" : "ok";
        const err = row.Err ? htmlEscape(row.Err) : "成功";
        return `<tr>
          <td>${row.index}</td>
          <td>${htmlEscape(row.T)}</td>
          <td>${htmlEscape(row.P)}</td>
          <td>${htmlEscape(row.M)}</td>
          <td>${htmlEscape(row.H)}</td>
          <td>${htmlEscape(row.S)}</td>
          <td>${htmlEscape(row.V)}</td>
          <td>${htmlEscape(row.G)}</td>
          <td>${htmlEscape(row.GJ)}</td>
          <td class="${statusClass}">${err}</td>
        </tr>`;
      }).join("");
    }

    function exportColumns() {
      return [
        ["序号", "index"],
        ["T", "T"],
        ["P", "P"],
        ["M", "M"],
        ["H", "H"],
        ["S", "S"],
        ["V", "V"],
        ["G", "G"],
        ["GJ", "GJ"],
        ["Err", "Err"],
      ];
    }

    function rowsToTSV(rows) {
      const columns = exportColumns();
      const header = columns.map(([label]) => label);
      const body = rows.map((row) => columns.map(([, key]) => row[key] ?? "").join("\t"));
      return [header.join("\t"), ...body].join("\n");
    }

    function rowsToCSV(rows) {
      const columns = exportColumns();
      const header = columns.map(([label]) => label);
      const escapeCSV = (value) => `"${String(value ?? "").replace(/"/g, '""')}"`;
      const body = rows.map((row) => columns.map(([, key]) => escapeCSV(row[key])).join(","));
      return "\ufeff" + [header.join(","), ...body].join("\n");
    }

    function syncOutput(rows) {
      els.output.value = rowsToTSV(rows);
      latestRows = rows;
      const hasRows = rows.length > 0;
      els.copy.disabled = !hasRows;
      els.copyH.disabled = !hasRows;
      els.download.disabled = !hasRows;
    }

    async function runBatch() {
      const rows = parseInput(els.input.value);
      if (!rows.length) {
        els.message.textContent = "没有可计算的数据";
        return;
      }

      shouldStop = false;
      setBusy(true);
      updateStats([], rows.length);
      renderTable([]);
      syncOutput([]);

      const results = [];
      const cache = new Map();

      for (const row of rows) {
        if (shouldStop) break;
        els.message.textContent = `正在计算第 ${row.index} 行`;
        const key = cacheKey(row);
        let result;
        if (cache.has(key)) {
          result = { ...cache.get(key), index: row.index };
        } else {
          result = await queryEasyQuery(row);
          cache.set(key, result);
          await sleep(DELAY_MS);
        }
        results.push(result);
        updateStats(results, rows.length);
        renderTable(results);
        syncOutput(results);
      }

      setBusy(false);
      els.message.textContent = shouldStop ? "已停止" : "计算完成";
    }

    els.run.addEventListener("click", runBatch);
    els.stop.addEventListener("click", () => {
      shouldStop = true;
      els.message.textContent = "正在停止";
    });
    els.sample.addEventListener("click", () => {
      els.input.value = [
        "T,P,M",
        "148.42,7.65,1000",
        "146.43,7.22,1000",
        "147.94,6.99,1000",
        "148.23,7.04,1000",
        "153.32,6.96,1000",
        "159,6.27,1000",
        "170.61,6.74,1000",
        "21.94,0.92,1000",
        "35.13,1.48,1000",
        "21.94,0.92,1000",
        "165,7.09,1000",
        "79.39,4.22,1000",
      ].join("\n");
      els.message.textContent = "示例已填入";
    });
    els.clear.addEventListener("click", () => {
      els.input.value = "";
      renderTable([]);
      syncOutput([]);
      updateStats([], 0);
      els.message.textContent = "已清空";
    });
    els.copy.addEventListener("click", async () => {
      await navigator.clipboard.writeText(rowsToTSV(latestRows));
      els.message.textContent = "结果已复制";
    });
    els.copyH.addEventListener("click", async () => {
      await navigator.clipboard.writeText(latestRows.map((row) => row.H || "").join("\n"));
      els.message.textContent = "焓值 H 已复制";
    });
    els.download.addEventListener("click", () => {
      const blob = new Blob([rowsToCSV(latestRows)], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "easyquery_results.csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      els.message.textContent = "CSV 已生成";
    });
    els.file.addEventListener("change", async () => {
      const file = els.file.files[0];
      if (!file) return;
      els.input.value = await file.text();
      els.message.textContent = `已导入 ${file.name}`;
      els.file.value = "";
    });
  </script>
</body>
</html>
